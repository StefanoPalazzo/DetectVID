services:
  db:
    image: postgres:15-alpine
    container_name: detectvid_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-detectvid2026}
      POSTGRES_DB: ${POSTGRES_DB:-detectvid}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - detectvid_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-detectvid}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: detectvid_ml
    restart: always
    expose:
      - "8000"
    volumes:
      # Montamos los modelos para no tener que reconstruir la imagen si cambian
      - ./ml/checkpoints:/app/checkpoints
    networks:
      - detectvid_network
    environment:
      - ENVIRONMENT=production
      - OMP_NUM_THREADS=4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ml/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: detectvid_backend
    restart: always
    expose:
      - "3001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-detectvid2026}@db:5432/${POSTGRES_DB:-detectvid}?schema=public
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_detectvid}
      - ML_API_URL=http://ml:8000
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - LOCAL_STORAGE_PATH=/app/uploads
      - LOCAL_STORAGE_URL=${PUBLIC_BASE_URL:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - FRONTEND_URLS=${FRONTEND_URLS:-http://localhost}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started
    networks:
      - detectvid_network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: detectvid_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - detectvid_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  detectvid_network:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
