server {
    listen 80;
    server_name localhost;

    # Archivos estáticos de React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para la API de ML (PyTorch/FastAPI)
    # Ejemplo: Fetch a /api/ml/predict -> FastAPI:8000/predict
    location /api/ml/ {
        proxy_pass http://ml:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Para subir imágenes grandes
        client_max_body_size 20M;
    }

    # Proxy reverso para el Backend (Express)
    # Ejemplo: Fetch a /api/users -> Express:3000/api/users
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }
}
